[package]
name = "rustguard-common"
version = "0.1.0"
edition.workspace = true

license.workspace = true

[features]
default = []
user = ["aya", "ipnet", "maxminddb", "sqlx", "systemd", "tracing"]

[dependencies]
aya = { workspace = true, optional = true }
ipnet = { version = "2.12.0", optional = true }
maxminddb = { version = "0.28.1", optional = true }
sqlx = { version = "0.9.0", optional = true }
systemd = { version = "0.10.1", optional = true }
tracing = { version = "0.1.44", optional = true }

[lib]
path = "src/lib.rs"
